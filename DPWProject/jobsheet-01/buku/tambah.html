<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Books - SIMPUS-Mini</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>
        <!-- GANTI KODE HAMBURGER LAMA DENGAN INI -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="list.html">List of Books</a></li>
                <li><a href="tambah.html">Add Books</a></li>
                <li><a href="../anggota/list.html">Member List</a></li>
                <li><a href="../anggota/tambah.html">Add Members</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Buku Baru</h2>
            <form id="form-tambah" action="" method="post">
                <p>
                    <label for="title">Title</label><br>
                    <input type="text" id="title" name="title" required>
                </p>

                <p>
                    <label for="author">Author</label><br>
                    <input type="text" id="author" name="author" required>
                </p>

                <p>
                    <label for="year">Year</label><br>
                    <input type="number" id="year" name="year" min="1900" max="2026" required>
                </p>

                <p>
                    <label for="isbn">ISBN</label><br>
                    <input type="text" id="isbn" name="isbn">
                </p>

                <p>
                    <label for="stock">Stock</label><br>
                    <input type="number" id="stock" name="stock" min="0" required>
                </p>

                <p>
                    <label for="category">Category</label><br>
                    <select id="category" name="category">
                        <option value="fiction">Fiction</option>
                        <option value="non-fiction">Non-Fiction</option>
                        <option value="reference">Reference</option>
                    </select>
                </p>

                <p style="margin-top: 1rem;">
                    <button type="submit">Simpan Buku</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini. All rights reserved.</p>
    </footer>
    <script src="assets/js/app.js"></script>
</body>
</html>
