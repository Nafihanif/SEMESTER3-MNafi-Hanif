<body>

    <header>
        <h1>SIMPUS-Mini</h1>
        <!-- GANTI KODE HAMBURGER LAMA DENGAN INI -->

        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Anggota Baru</h2>
            <form id="form-tambah" action="" method="post">
                <p>
                    <label for="member_no">Nomor Anggota</label><br>
                    <input type="text" id="member_no" name="member_no" required>
                </p>

                <p>
                    <label for="name">Nama Lengkap</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="address">Alamat</label><br>
                    <textarea id="address" name="address" rows="3"></textarea>
                </p>

                <p>
                    <label for="phone">Nomor Telepon</label><br>
                    <input type="tel" id="phone" name="phone">
                </p>

                <p style="margin-top: 1rem;">
                    <button type="submit">Simpan Anggota</button>
                </p>
            </form>
        </section>
    </main>
